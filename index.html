<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lakeview Brain</title>
<meta name="theme-color" content="#f4efe3">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f4efe3;--card:#fffdf8;--ink:#162321;--muted:#6d7774;--green:#167364;--rule:#ddd8cd;--amber:#c97b2e;--red:#c34e3f;--blue:#3f68ad}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}
.landing{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:var(--bg);z-index:3000}.landing.hidden{display:none}.landing-card{width:min(620px,100%)}.brand{font-size:14px;font-weight:800;margin-bottom:26px}.landing h1{font-family:Georgia,serif;font-size:clamp(40px,8vw,68px);line-height:.95;letter-spacing:-.04em;margin:0 0 12px}.landing p{color:var(--muted);font-size:15px;margin:0 0 22px}
.search-wrap{position:relative}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;border:1px solid var(--rule);background:var(--card);border-radius:18px;padding:18px;font-size:17px;color:var(--ink);outline:none;box-shadow:0 10px 30px rgba(20,30,28,.05)}.search input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(22,115,100,.12)}.search button{border:0;border-radius:18px;background:var(--green);color:#fff;padding:0 22px;font-weight:800}.find-me{margin-top:14px;border:0;background:transparent;color:var(--green);font-weight:800;padding:8px 2px}
.suggestions{position:absolute;left:0;right:96px;top:calc(100% + 8px);display:none;background:var(--card);border:1px solid var(--rule);border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(20,30,28,.14);z-index:3100}.suggestions.open{display:block}.suggestion{width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:13px 15px;text-align:left;color:var(--ink)}.suggestion:last-child{border-bottom:0}.suggestion strong{display:block;font-size:14px}.suggestion span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.brain{position:fixed;inset:0;display:none;background:#edf0ed}.brain.active{display:block}.map{position:absolute;inset:0}.map-ui{position:absolute;inset:0;z-index:800;pointer-events:none}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 16px));pointer-events:none}
.address-bar,.summary{background:rgba(255,253,248,.96);backdrop-filter:blur(14px);border:1px solid rgba(221,216,205,.9);box-shadow:0 10px 34px rgba(20,30,28,.12);pointer-events:auto}
.address-bar{display:flex;align-items:center;border-radius:18px;padding:9px 13px}.address-bar button{width:100%;border:0;background:transparent;text-align:left;color:var(--ink);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:5px 3px}
.summary{margin-top:8px;border-radius:16px;padding:11px 13px}.summary strong{display:block;font-family:Georgia,serif;font-size:23px;line-height:1}.summary span{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.bottom-controls{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,calc(100% - 16px));background:rgba(255,253,248,.95);backdrop-filter:blur(16px);border:1px solid rgba(221,216,205,.9);border-radius:20px;box-shadow:0 12px 38px rgba(20,30,28,.16);padding:10px;pointer-events:auto}
.filters{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{border:1px solid var(--rule);background:#fffdf8;color:var(--ink);border-radius:999px;padding:10px 13px;font-size:12px;font-weight:800;white-space:nowrap}.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.legend{display:flex;gap:13px;margin-top:9px;padding:0 3px;color:var(--muted);font-size:10px;overflow-x:auto;white-space:nowrap}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.search-area{position:absolute;left:50%;bottom:116px;transform:translateX(-50%);display:none;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:10px 15px;font-size:12px;font-weight:800;box-shadow:0 8px 28px rgba(20,30,28,.2);pointer-events:auto}.search-area.show{display:block}
.state{position:absolute;left:50%;bottom:116px;transform:translateX(-50%);display:none;background:rgba(255,253,248,.96);border:1px solid var(--rule);border-radius:999px;padding:9px 13px;color:var(--muted);font-size:11px;font-weight:800;box-shadow:0 6px 22px rgba(20,30,28,.1);pointer-events:none}.state.show{display:block}.state.error{color:#934c19;background:#fff4e6}
.here{width:18px;height:18px;border-radius:50%;background:var(--ink);border:4px solid #fff;box-shadow:0 0 0 2px var(--ink)}
.obs-hit{width:48px;height:48px;display:grid;place-items:center}.obs-pin{width:19px;height:19px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 10px rgba(20,30,28,.26)}
.leaflet-tile-pane{filter:grayscale(1) saturate(0) brightness(1.17) contrast(.64) opacity(.5)}.leaflet-control-attribution{opacity:.3;font-size:8px!important}
.detail-backdrop{position:fixed;inset:0;background:rgba(15,24,22,.14);z-index:3980;display:none}.detail-backdrop.show{display:block}.detail-sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(640px,100%);background:var(--card);border-radius:24px 24px 0 0;z-index:3990;box-shadow:0 -18px 60px rgba(21,35,33,.2);transition:transform .22s ease;padding:9px 18px calc(22px + env(safe-area-inset-bottom))}.detail-sheet.show{transform:translate(-50%,0)}.handle{width:34px;height:4px;background:#c8c4ba;border-radius:10px;margin:4px auto 13px}.detail-top{display:flex;justify-content:space-between;gap:14px}.detail-kicker{font-size:9px;letter-spacing:.09em;font-weight:800;color:var(--amber);text-transform:uppercase;margin-bottom:5px}.detail-title{font-family:Georgia,serif;font-size:27px;line-height:1.05;margin:0}.close-sheet{border:0;background:#f0ece3;width:34px;height:34px;border-radius:50%;font-size:20px}.detail-body{color:var(--ink);font-size:14px;line-height:1.45;margin-top:12px}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.field{border-top:1px solid var(--rule);padding-top:9px}.field small{display:block;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.field strong{font-size:13px;line-height:1.35}.evidence{margin-top:15px;border-top:1px solid var(--rule);padding-top:12px;color:var(--muted);font-size:11px;line-height:1.45}
@media(max-width:600px){.landing-card{margin-top:-12vh}.landing h1{font-size:46px}.search{flex-direction:column}.search button{height:52px}.suggestions{right:0}.top{top:max(8px,env(safe-area-inset-top))}.summary strong{font-size:21px}.bottom-controls{bottom:max(8px,env(safe-area-inset-bottom));padding:9px}.chip{padding:10px 12px}.search-area,.state{bottom:112px}}
</style>
</head>
<body>
<section class="landing" id="landing"><div class="landing-card"><div class="brand">↝ Lakeview Brain</div><h1>What deserves attention nearby?</h1><p>Start with an address.</p><div class="search-wrap"><form class="search" id="search-form" autocomplete="off"><input id="address" placeholder="659 W Cornelia Ave" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" required><button type="submit">Explore</button></form><div class="suggestions" id="suggestions"></div></div><button class="find-me" id="find-me" type="button">⌖ Find me</button></div></section>
<section class="brain" id="brain"><div id="map" class="map"></div><div class="map-ui"><div class="top"><div class="address-bar"><button id="change-address" type="button"></button></div><div class="summary"><strong id="summary-title">Checking the neighborhood…</strong><span id="summary-note">Looking for unresolved, recurring and safety signals.</span></div></div><button id="search-area" class="search-area" type="button">Search this area</button><div id="state" class="state"></div><div class="bottom-controls"><nav class="filters"><button class="chip filter" data-filter="all" aria-pressed="true">Worth noticing</button><button class="chip filter" data-filter="unresolved" aria-pressed="false">Unresolved</button><button class="chip filter" data-filter="recurring" aria-pressed="false">Recurring</button><button class="chip filter" data-filter="safety" aria-pressed="false">Safety</button></nav><div class="legend"><span><i style="background:#c97b2e"></i>tree gap</span><span><i style="background:#c34e3f"></i>recurring issue</span><span><i style="background:#3f68ad"></i>safety</span></div></div></div></section>
<div class="detail-backdrop" id="detail-backdrop"></div><aside class="detail-sheet" id="detail-sheet"><div class="handle"></div><div class="detail-top"><div><div class="detail-kicker" id="detail-kicker"></div><h2 class="detail-title" id="detail-title"></h2></div><button class="close-sheet" id="close-sheet" type="button">×</button></div><div class="detail-body" id="detail-body"></div><div class="detail-grid" id="detail-grid"></div><div class="evidence" id="detail-evidence"></div></aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){'use strict';
var landing=document.getElementById('landing'),brain=document.getElementById('brain'),form=document.getElementById('search-form'),input=document.getElementById('address'),suggestions=document.getElementById('suggestions'),findMe=document.getElementById('find-me'),changeAddress=document.getElementById('change-address'),searchArea=document.getElementById('search-area'),state=document.getElementById('state'),summaryTitle=document.getElementById('summary-title'),summaryNote=document.getElementById('summary-note'),backdrop=document.getElementById('detail-backdrop'),sheet=document.getElementById('detail-sheet'),closeSheet=document.getElementById('close-sheet'),detailKicker=document.getElementById('detail-kicker'),detailTitle=document.getElementById('detail-title'),detailBody=document.getElementById('detail-body'),detailGrid=document.getElementById('detail-grid'),detailEvidence=document.getElementById('detail-evidence');
var SODA='https://data.cityofchicago.org/resource/v6vf-nfxy.json',CRASH='https://data.cityofchicago.org/resource/85ca-t3if.json';var map,layer,here,observations=[],filter='all',requestToken=0,selectedSuggestion=null,suggestTimer=null,programmaticMove=false;var COLORS={tree:'#c97b2e',recurring:'#c34e3f',safety:'#3f68ad'};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]})}function setState(t,e){state.textContent=t||'';state.classList.toggle('show',!!t);state.classList.toggle('error',!!e);if(t)searchArea.classList.remove('show')}function hideState(){state.classList.remove('show','error')}function setPressed(selector,active){document.querySelectorAll(selector).forEach(function(b){b.setAttribute('aria-pressed',String(b===active))})}function fetchJSON(u,t){var c=new AbortController(),q=setTimeout(function(){c.abort()},t||14000);return fetch(u,{signal:c.signal}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).finally(function(){clearTimeout(q)})}function dist(a,b,c,d){var R=6371000,p=Math.PI/180,x=(d-b)*p*Math.cos((a+c)*p/2),y=(c-a)*p;return Math.sqrt(x*x+y*y)*R}function closeSuggestions(){suggestions.classList.remove('open');suggestions.innerHTML='';input.setAttribute('aria-expanded','false')}function suggest(q){return fetchJSON('https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/suggest?f=json&countryCode=USA&maxSuggestions=6&text='+encodeURIComponent(q+', Chicago, IL'),7000).then(function(j){return(j.suggestions||[]).filter(function(x){return/Chicago|IL/i.test(x.text||'')})})}function resolveAddress(t,k){var u='https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&maxLocations=1&outFields=Match_addr&singleLine='+encodeURIComponent(t)+(k?'&magicKey='+encodeURIComponent(k):'');return fetchJSON(u,7000).then(function(j){if(!j.candidates||!j.candidates.length)throw new Error('not found');var c=j.candidates[0];return{lat:Number(c.location.y),lon:Number(c.location.x),label:c.address||t}})}function reverseGeocode(lat,lon){var u='https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/reverseGeocode?f=json&location='+encodeURIComponent(lon+','+lat);return fetchJSON(u,7000).then(function(j){return{lat:lat,lon:lon,label:(j.address&&j.address.Match_addr)||'Current location'}})}
if(!window.L){alert('Map library failed to load');return}map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([41.9395,-87.644],15);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);layer=L.layerGroup().addTo(map);
input.addEventListener('input',function(){selectedSuggestion=null;clearTimeout(suggestTimer);var q=input.value.trim();if(q.length<4){closeSuggestions();return}suggestTimer=setTimeout(function(){suggest(q).then(function(list){suggestions.innerHTML='';list.forEach(function(s){var b=document.createElement('button');b.type='button';b.className='suggestion';b.innerHTML='<strong>'+esc((s.text||'').split(',')[0])+'</strong><span>'+esc((s.text||'').split(',').slice(1).join(',').trim())+'</span>';b.onclick=function(){selectedSuggestion=s;input.value=(s.text||'').split(',').slice(0,2).join(',');closeSuggestions();resolveAddress(s.text,s.magicKey).then(launch).catch(function(){setState('Could not confirm that address',true)})};suggestions.appendChild(b)});suggestions.classList.toggle('open',list.length>0);input.setAttribute('aria-expanded',String(list.length>0))}).catch(closeSuggestions)},220)});
function boundsWhere(days){var b=map.getBounds(),sw=b.getSouthWest(),ne=b.getNorthEast(),from=new Date(Date.now()-days*86400000).toISOString().slice(0,10);return{sw:sw,ne:ne,from:from}}function sodaQuery(type,days){var b=boundsWhere(days),u=new URL(SODA),w="created_date > '"+b.from+"T00:00:00' AND latitude between "+b.sw.lat+' and '+b.ne.lat+' AND longitude between '+b.sw.lng+' and '+b.ne.lng;if(type)w+=" AND sr_type like '%"+type+"%'";u.searchParams.set('$select','sr_number,sr_type,status,created_date,closed_date,street_number,street_direction,street_name,street_type,latitude,longitude');u.searchParams.set('$where',w);u.searchParams.set('$limit','3000');return fetchJSON(u.toString(),14000)}function crashQuery(){var b=boundsWhere(1825),u=new URL(CRASH),w="first_crash_type='PEDALCYCLIST' AND crash_date > '"+b.from+"T00:00:00' AND latitude between "+b.sw.lat+' and '+b.ne.lat+' AND longitude between '+b.sw.lng+' and '+b.ne.lng;u.searchParams.set('$select','crash_date,latitude,longitude,street_direction,street_name,most_severe_injury');u.searchParams.set('$where',w);u.searchParams.set('$limit','3000');return fetchJSON(u.toString(),14000)}
function cluster(rows,meters,minCount){var used=new Set(),out=[];rows.forEach(function(r,i){if(used.has(i))return;var lat=Number(r.latitude),lon=Number(r.longitude);if(!isFinite(lat)||!isFinite(lon))return;var members=[];rows.forEach(function(q,j){if(used.has(j))return;var qlat=Number(q.latitude),qlon=Number(q.longitude);if(isFinite(qlat)&&isFinite(qlon)&&dist(lat,lon,qlat,qlon)<=meters)members.push(j)});if(members.length>=minCount){members.forEach(function(j){used.add(j)});var pts=members.map(function(j){return rows[j]}),alat=pts.reduce(function(s,x){return s+Number(x.latitude)},0)/pts.length,alon=pts.reduce(function(s,x){return s+Number(x.longitude)},0)/pts.length;out.push({lat:alat,lon:alon,rows:pts,count:pts.length})}});return out}
function treeObservations(removals,plantings){var now=Date.now(),out=[];removals.forEach(function(r){var lat=Number(r.latitude),lon=Number(r.longitude),closed=new Date(r.closed_date||r.created_date).getTime();if(!isFinite(lat)||!isFinite(lon)||!closed||now-closed<180*86400000)return;var matched=plantings.some(function(p){var plat=Number(p.latitude),plon=Number(p.longitude),created=new Date(p.created_date).getTime();return isFinite(plat)&&isFinite(plon)&&created>=closed-30*86400000&&dist(lat,lon,plat,plon)<=40});if(!matched){var months=Math.round((now-closed)/(30.4*86400000));out.push({kind:'tree',group:'unresolved',lat:lat,lon:lon,title:'Possible tree replacement gap',body:'A tree-removal workflow was closed here and no nearby planting request appears to have followed.',confidence:'Medium',metric:months+' months',metricLabel:'since removal closed',evidence:[r]})}});return out}function recurringObservations(rows,label,days){return cluster(rows,35,3).map(function(c){return{kind:'recurring',group:'recurring',lat:c.lat,lon:c.lon,title:'Recurring '+label+' reports',body:'This small area keeps generating '+label+' reports, which can indicate a persistent condition or repeated reporting.',confidence:'Reported activity',metric:c.count+' reports',metricLabel:'within '+days+' days',evidence:c.rows}})}function safetyObservations(rows){return cluster(rows,55,3).map(function(c){var serious=c.rows.filter(function(r){return /INCAPACITATING|FATAL/i.test(r.most_severe_injury||'')}).length;return{kind:'safety',group:'safety',lat:c.lat,lon:c.lon,title:'Crash-prone bike area',body:'Multiple reported pedalcyclist crashes are concentrated around this area.',confidence:'High',metric:c.count+' crashes',metricLabel:'past 5 years'+(serious?' · '+serious+' serious':''),evidence:c.rows}})}
function loadObservations(){var token=++requestToken;setState('Looking for things worth noticing…');summaryTitle.textContent='Checking the neighborhood…';summaryNote.textContent='Looking for unresolved, recurring and safety signals.';var jobs=[sodaQuery('Tree Removal',730),sodaQuery('Tree Planting',730),sodaQuery('Graffiti',365),sodaQuery('Rodent',180),crashQuery()];Promise.allSettled(jobs).then(function(results){if(token!==requestToken)return;var removals=results[0].status==='fulfilled'?results[0].value:[],plantings=results[1].status==='fulfilled'?results[1].value:[],graffiti=results[2].status==='fulfilled'?results[2].value:[],rats=results[3].status==='fulfilled'?results[3].value:[],crashes=results[4].status==='fulfilled'?results[4].value:[];observations=[].concat(treeObservations(removals,plantings),recurringObservations(graffiti,'graffiti',365),recurringObservations(rats,'rat',180),safetyObservations(crashes));render();hideState();searchArea.classList.remove('show');var failed=results.filter(function(r){return r.status==='rejected'}).length;if(failed)summaryNote.textContent='Some city feeds did not respond, so this is a partial snapshot.'}).catch(function(){setState('Could not build the neighborhood snapshot. Tap Search this area to retry.',true)})}
function visibleObservations(){return observations.filter(function(o){return filter==='all'||o.group===filter})}function render(){layer.clearLayers();var list=visibleObservations();list.forEach(function(o){var icon=L.divIcon({className:'',html:'<div class="obs-hit"><div class="obs-pin" style="background:'+COLORS[o.kind]+'"></div></div>',iconSize:[48,48],iconAnchor:[24,24]});var m=L.marker([o.lat,o.lon],{icon:icon});m.on('click',function(){openDetail(o)});m.addTo(layer)});summaryTitle.textContent=list.length===1?'1 thing worth noticing':list.length+' things worth noticing';var u=observations.filter(function(o){return o.group==='unresolved'}).length,r=observations.filter(function(o){return o.group==='recurring'}).length,s=observations.filter(function(o){return o.group==='safety'}).length;summaryNote.textContent=u+' unresolved · '+r+' recurring · '+s+' safety';if(!list.length)summaryNote.textContent='No strong signal in this view. That does not mean no issues exist.'}
function openDetail(o){detailKicker.textContent=o.group==='unresolved'?'Unresolved':o.group==='recurring'?'Recurring pattern':'Safety';detailTitle.textContent=o.title;detailBody.textContent=o.body;detailGrid.innerHTML='<div class="field"><small>Signal</small><strong>'+esc(o.metric)+'</strong></div><div class="field"><small>Context</small><strong>'+esc(o.metricLabel)+'</strong></div><div class="field"><small>Confidence</small><strong>'+esc(o.confidence)+'</strong></div><div class="field"><small>Action</small><strong>'+(o.group==='unresolved'?'Verify or report':'Inspect the hotspot')+'</strong></div>';detailEvidence.textContent='Based on '+o.evidence.length+' underlying city record'+(o.evidence.length===1?'':'s')+'. This is an inference from administrative data, not a direct observation of current physical conditions.';sheet.classList.add('show');backdrop.classList.add('show')}function closeDetail(){sheet.classList.remove('show');backdrop.classList.remove('show')}
function launch(r){landing.classList.add('hidden');brain.classList.add('active');changeAddress.textContent=r.label;setTimeout(function(){map.invalidateSize();programmaticMove=true;map.setView([r.lat,r.lon],16);setTimeout(function(){programmaticMove=false;loadObservations()},250)},30);if(here)map.removeLayer(here);here=L.marker([r.lat,r.lon],{icon:L.divIcon({className:'',html:'<div class="here"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);var u=new URL(location.href);u.searchParams.set('address',r.label);history.replaceState(null,'',u.toString())}
form.addEventListener('submit',function(e){e.preventDefault();closeSuggestions();var q=input.value.trim();if(!q)return;var p=selectedSuggestion?resolveAddress(selectedSuggestion.text,selectedSuggestion.magicKey):resolveAddress(q+', Chicago, IL','');p.then(launch).catch(function(){setState('Could not confirm that address',true)})});findMe.onclick=function(){if(!navigator.geolocation){setState('Location is not available in this browser.',true);return}findMe.textContent='Finding you…';navigator.geolocation.getCurrentPosition(function(p){reverseGeocode(p.coords.latitude,p.coords.longitude).then(launch).catch(function(){launch({lat:p.coords.latitude,lon:p.coords.longitude,label:'Current location'})}).finally(function(){findMe.textContent='⌖ Find me'})},function(){findMe.textContent='⌖ Find me';setState('Location permission was not granted.',true)},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})};changeAddress.onclick=function(){landing.classList.remove('hidden');brain.classList.remove('active');input.value=changeAddress.textContent;setTimeout(function(){input.focus()},50)};map.on('moveend',function(){if(programmaticMove||!brain.classList.contains('active'))return;searchArea.classList.add('show');hideState()});searchArea.onclick=loadObservations;document.querySelectorAll('.filter').forEach(function(b){b.onclick=function(){filter=b.dataset.filter;setPressed('.filter',b);render()}});backdrop.onclick=closeDetail;closeSheet.onclick=closeDetail;var initial=new URLSearchParams(location.search).get('address');if(initial){input.value=initial;resolveAddress(initial+', Chicago, IL','').then(launch).catch(function(){})}
})();
</script>
</body>
</html>
