<!doctype html>
<html lang="en">
<head>

<title>Lakeview Brain</title>
<meta name="theme-color" content="#f4efe3">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f4efe3;--card:#fffdf8;--ink:#162321;--muted:#6d7774;--green:#167364;--rule:#ddd8cd;--plant:#1f9a80;--remove:#65766f;--graffiti:#df6046;--rat:#98652c;--bike:#3f68ad}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}.landing{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:var(--bg);z-index:3000}.landing.hidden{display:none}.landing-card{width:min(620px,100%)}.brand{font-size:14px;font-weight:800;margin-bottom:26px}.landing h1{font-family:Georgia,serif;font-size:clamp(40px,8vw,68px);line-height:.95;letter-spacing:-.04em;margin:0 0 12px}.landing p{color:var(--muted);font-size:15px;margin:0 0 22px}.search-wrap{position:relative}.search{display:flex;gap:8px}.search input{flex:1;min-width:0;border:1px solid var(--rule);background:var(--card);border-radius:18px;padding:18px;font-size:17px;color:var(--ink);outline:none;box-shadow:0 10px 30px rgba(20,30,28,.05)}.search input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(22,115,100,.12)}.search button{border:0;border-radius:18px;background:var(--green);color:#fff;padding:0 22px;font-weight:800}.find-me{display:inline-flex;align-items:center;gap:7px;margin-top:12px;border:0;background:transparent;color:var(--green);font-size:14px;font-weight:800;padding:6px 2px}.find-me:disabled{opacity:.5;cursor:default}.suggestions{position:absolute;left:0;right:96px;top:calc(100% + 8px);display:none;background:var(--card);border:1px solid var(--rule);border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(20,30,28,.14);z-index:3100}.suggestions.open{display:block}.suggestion{width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:13px 15px;text-align:left;color:var(--ink)}.suggestion:last-child{border-bottom:0}.suggestion strong{display:block;font-size:14px}.suggestion span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.brain{position:fixed;inset:0;display:none;background:#edf0ed}.brain.active{display:block}.map{position:absolute;inset:0}.map-ui{position:absolute;inset:0;z-index:800;pointer-events:none}.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 16px));pointer-events:none}.address-bar{display:flex;align-items:center;background:rgba(255,253,248,.96);backdrop-filter:blur(14px);border:1px solid rgba(221,216,205,.9);border-radius:18px;padding:9px 13px;box-shadow:0 10px 34px rgba(20,30,28,.13);pointer-events:auto}.address-bar button{width:100%;border:0;background:transparent;text-align:left;color:var(--ink);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:5px 3px}.stats{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,253,248,.94);backdrop-filter:blur(14px);border:1px solid rgba(221,216,205,.9);border-radius:16px;box-shadow:0 8px 28px rgba(20,30,28,.11);overflow:hidden;pointer-events:auto}.stat{padding:9px 11px}.stat+.stat{border-left:1px solid var(--rule)}.stat-label{font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.stat-value{font-family:Georgia,serif;font-size:22px;line-height:1;margin-top:3px;font-weight:700}.stat-note{font-size:8px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottom-controls{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,calc(100% - 16px));background:rgba(255,253,248,.94);backdrop-filter:blur(16px);border:1px solid rgba(221,216,205,.9);border-radius:20px;box-shadow:0 12px 38px rgba(20,30,28,.16);padding:10px;pointer-events:auto}.filters,.refine{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.filters::-webkit-scrollbar,.refine::-webkit-scrollbar{display:none}.refine{margin-top:8px;align-items:center}.chip{border:1px solid var(--rule);background:#fffdf8;color:var(--ink);border-radius:999px;padding:10px 13px;font-size:12px;font-weight:800;white-space:nowrap}.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}.refine .chip{padding:8px 11px;font-size:11px}.refine .chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}.label{font-size:9px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.bike-mode .status-part{display:none}.search-area{position:absolute;left:50%;bottom:154px;transform:translateX(-50%);display:none;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:10px 15px;font-size:12px;font-weight:800;box-shadow:0 8px 28px rgba(20,30,28,.2);pointer-events:auto}.search-area.show{display:block}.state{position:absolute;left:50%;bottom:154px;transform:translateX(-50%);display:none;background:rgba(255,253,248,.96);border:1px solid var(--rule);border-radius:999px;padding:9px 13px;color:var(--muted);font-size:11px;font-weight:800;box-shadow:0 6px 22px rgba(20,30,28,.1);pointer-events:none}.state.show{display:block}.state.error{color:#934c19;background:#fff4e6}.here{width:18px;height:18px;border-radius:50%;background:var(--ink);border:4px solid #fff;box-shadow:0 0 0 2px var(--ink)}.pin-hit{width:46px;height:46px;display:grid;place-items:center}.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(20,30,28,.22)}.leaflet-tile-pane{filter:grayscale(1) saturate(0) brightness(1.17) contrast(.64) opacity(.5)}.leaflet-control-attribution{opacity:.3;font-size:8px!important}.detail-backdrop{position:fixed;inset:0;background:rgba(15,24,22,.14);z-index:3980;display:none}.detail-backdrop.show{display:block}.detail-sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(640px,100%);background:var(--card);border-radius:24px 24px 0 0;z-index:3990;box-shadow:0 -18px 60px rgba(21,35,33,.2);transition:transform .22s ease;padding:9px 18px calc(22px + env(safe-area-inset-bottom))}.detail-sheet.show{transform:translate(-50%,0)}.handle{width:34px;height:4px;background:#c8c4ba;border-radius:10px;margin:4px auto 13px}.detail-top{display:flex;justify-content:space-between;gap:14px}.detail-kicker{font-size:9px;letter-spacing:.09em;font-weight:800;color:#e4973e;text-transform:uppercase;margin-bottom:5px}.detail-title{font-family:Georgia,serif;font-size:25px;line-height:1.05;margin:0}.close-sheet{border:0;background:#f0ece3;width:34px;height:34px;border-radius:50%;font-size:20px}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.field{border-top:1px solid var(--rule);padding-top:9px}.field small{display:block;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.field strong{font-size:13px;line-height:1.35}@media(max-width:600px){.landing-card{margin-top:-12vh}.landing h1{font-size:46px}.search{flex-direction:column}.search button{height:52px}.suggestions{right:0}.top{top:max(8px,env(safe-area-inset-top))}.stats{margin-top:6px}.stat{padding:8px}.stat-value{font-size:20px}.bottom-controls{bottom:max(8px,env(safe-area-inset-bottom));padding:9px}.chip{padding:10px 12px}.search-area,.state{bottom:150px}}
</style>
</head>
<body>
<section class="landing" id="landing"><div class="landing-card"><div class="brand">↝ Lakeview Brain</div><h1>What’s happening around you?</h1><p>Start with an address.</p><div class="search-wrap"><form class="search" id="search-form" autocomplete="off"><input id="address" placeholder="659 W Cornelia Ave" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" required><button type="submit">Explore</button></form><button class="find-me" id="find-me" type="button">⌖ Find me</button><div class="suggestions" id="suggestions"></div></div></div></section>
<section class="brain" id="brain"><div id="map" class="map"></div><div class="map-ui"><div class="top"><div class="address-bar"><button id="change-address" type="button"></button></div><div class="stats"><div class="stat"><div class="stat-label" id="s1-label">Requests</div><div class="stat-value" id="s1-value">—</div><div class="stat-note" id="s1-note">visible area</div></div><div class="stat"><div class="stat-label" id="s2-label">Open</div><div class="stat-value" id="s2-value">—</div><div class="stat-note" id="s2-note">currently open</div></div><div class="stat"><div class="stat-label" id="s3-label">Closed</div><div class="stat-value" id="s3-value">—</div><div class="stat-note" id="s3-note">completed</div></div></div></div><button id="search-area" class="search-area" type="button">Search this area</button><div id="state" class="state"></div><div class="bottom-controls" id="bottom-controls"><nav class="filters"><button class="chip category" data-category="planting" aria-pressed="true">Tree planting</button><button class="chip category" data-category="removal" aria-pressed="false">Tree removal</button><button class="chip category" data-category="graffiti" aria-pressed="false">Graffiti</button><button class="chip category" data-category="rats" aria-pressed="false">Rats</button><button class="chip category" data-category="bike" aria-pressed="false">Bike crashes</button></nav><div class="refine"><span class="label status-part">Status</span><button class="chip status-part status-filter" data-status="all" aria-pressed="true">All</button><button class="chip status-part status-filter" data-status="open" aria-pressed="false">Open</button><button class="chip status-part status-filter" data-status="closed" aria-pressed="false">Closed</button><span class="label">Time</span><button class="chip time" data-days="30" aria-pressed="false">30d</button><button class="chip time" data-days="90" aria-pressed="true">90d</button><button class="chip time" data-days="365" aria-pressed="false">1y</button><span class="label">View</span><button class="chip view" data-view="pins" aria-pressed="true">Pins</button><button class="chip view" data-view="hotspots" aria-pressed="false">Heat map</button></div></div></div></section>
<div class="detail-backdrop" id="detail-backdrop"></div><aside class="detail-sheet" id="detail-sheet"><div class="handle"></div><div class="detail-top"><div><div class="detail-kicker" id="detail-kicker"></div><h2 class="detail-title" id="detail-title"></h2></div><button class="close-sheet" id="close-sheet" type="button">×</button></div><div class="detail-grid" id="detail-grid"></div></aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
<script>
(function(){'use strict';
var landing=document.getElementById('landing'),brain=document.getElementById('brain'),form=document.getElementById('search-form'),input=document.getElementById('address'),findMe=document.getElementById('find-me'),suggestions=document.getElementById('suggestions'),changeAddress=document.getElementById('change-address'),searchArea=document.getElementById('search-area'),state=document.getElementById('state'),bottomControls=document.getElementById('bottom-controls'),backdrop=document.getElementById('detail-backdrop'),sheet=document.getElementById('detail-sheet'),closeSheet=document.getElementById('close-sheet'),detailKicker=document.getElementById('detail-kicker'),detailTitle=document.getElementById('detail-title'),detailGrid=document.getElementById('detail-grid');
var SODA='https://data.cityofchicago.org/resource/v6vf-nfxy.json',CRASH='https://data.cityofchicago.org/resource/85ca-t3if.json';var map,layer,here,category='planting',days=90,statusFilter='all',viewMode='pins',rows=[],requestToken=0,selectedSuggestion=null,suggestTimer=null,programmaticMove=false;var colors={planting:'#1f9a80',removal:'#65766f',graffiti:'#df6046',rats:'#98652c',bike:'#3f68ad'};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]})}function dateLabel(v){var d=new Date(v);return isNaN(d.getTime())?'':d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}function isOpen(v){return !/^(completed|closed)$/i.test(String(v||''))}function setState(t,e){state.textContent=t||'';state.classList.toggle('show',!!t);state.classList.toggle('error',!!e);if(t)searchArea.classList.remove('show')}function hideState(){state.classList.remove('show','error')}function setPressed(s,a){document.querySelectorAll(s).forEach(function(b){b.setAttribute('aria-pressed',String(b===a))})}function setStat(n,l,v,x){document.getElementById('s'+n+'-label').textContent=l;document.getElementById('s'+n+'-value').textContent=String(v);document.getElementById('s'+n+'-note').textContent=x}function fetchJSON(u,t){var c=new AbortController(),q=setTimeout(function(){c.abort()},t||12000);return fetch(u,{signal:c.signal}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).finally(function(){clearTimeout(q)})}function closeSuggestions(){suggestions.classList.remove('open');suggestions.innerHTML='';input.setAttribute('aria-expanded','false')}function suggest(q){return fetchJSON('https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/suggest?f=json&countryCode=USA&maxSuggestions=6&text='+encodeURIComponent(q+', Chicago, IL'),7000).then(function(j){return(j.suggestions||[]).filter(function(x){return/Chicago|IL/i.test(x.text||'')})})}function resolveAddress(t,k){var u='https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&maxLocations=1&outFields=Match_addr&singleLine='+encodeURIComponent(t)+(k?'&magicKey='+encodeURIComponent(k):'');return fetchJSON(u,7000).then(function(j){if(!j.candidates||!j.candidates.length)throw new Error('not found');var c=j.candidates[0];return{lat:Number(c.location.y),lon:Number(c.location.x),label:c.address||t}})}
if(!window.L){alert('Map library failed to load');return}map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([41.9395,-87.644],15);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);layer=L.layerGroup().addTo(map);
input.addEventListener('input',function(){selectedSuggestion=null;clearTimeout(suggestTimer);var q=input.value.trim();if(q.length<4){closeSuggestions();return}suggestTimer=setTimeout(function(){suggest(q).then(function(list){suggestions.innerHTML='';list.forEach(function(s){var b=document.createElement('button');b.type='button';b.className='suggestion';b.innerHTML='<strong>'+esc((s.text||'').split(',')[0])+'</strong><span>'+esc((s.text||'').split(',').slice(1).join(',').trim())+'</span>';b.onclick=function(){selectedSuggestion=s;input.value=(s.text||'').split(',').slice(0,2).join(',');closeSuggestions();resolveAddress(s.text,s.magicKey).then(launch).catch(function(){setState('Could not confirm that address',true)})};suggestions.appendChild(b)});suggestions.classList.toggle('open',list.length>0);input.setAttribute('aria-expanded',String(list.length>0))}).catch(closeSuggestions)},220)});
function where(){var b=map.getBounds(),sw=b.getSouthWest(),ne=b.getNorthEast(),from=new Date(Date.now()-days*86400000).toISOString().slice(0,10);if(category==='bike')return"first_crash_type='PEDALCYCLIST' AND crash_date > '"+from+"T00:00:00' AND latitude between "+sw.lat+' and '+ne.lat+' AND longitude between '+sw.lng+' and '+ne.lng;var w="created_date > '"+from+"T00:00:00' AND latitude between "+sw.lat+' and '+ne.lat+' AND longitude between '+sw.lng+' and '+ne.lng;if(category==='planting')w+=" AND sr_type='Tree Planting Request'";if(category==='removal')w+=" AND sr_type='Tree Removal Inspection'";if(category==='graffiti')w+=" AND sr_type like '%Graffiti%'";if(category==='rats')w+=" AND sr_type like '%Rodent%'";if(statusFilter==='open')w+=" AND status not in('Completed','Closed')";if(statusFilter==='closed')w+=" AND status in('Completed','Closed')";return w}
function query(){var token=++requestToken,base=category==='bike'?CRASH:SODA,select=category==='bike'?'crash_date,latitude,longitude,street_direction,street_name,most_severe_injury':'sr_number,sr_type,status,created_date,closed_date,street_number,street_direction,street_name,street_type,latitude,longitude',u=new URL(base);u.searchParams.set('$select',select);u.searchParams.set('$where',where());u.searchParams.set('$limit','3000');setState('Loading nearby data…');setStat(1,'Requests','…','loading');setStat(2,'Open','…','loading');setStat(3,'Closed','…','loading');fetchJSON(u.toString(),12000).then(function(d){if(token!==requestToken)return;rows=d;render();hideState();searchArea.classList.remove('show')}).catch(function(e){if(token!==requestToken)return;rows=[];render();setState(e.name==='AbortError'?'City data is taking too long. Tap Search this area to retry.':'City data could not load. Tap Search this area to retry.',true)})}
function color(){return colors[category]||'#167364'}function makePin(r){var lat=Number(r.latitude),lon=Number(r.longitude);if(!isFinite(lat)||!isFinite(lon))return;var i=L.divIcon({className:'',html:'<div class="pin-hit"><div class="pin-dot" style="background:'+color()+'"></div></div>',iconSize:[46,46],iconAnchor:[23,23]}),m=L.marker([lat,lon],{icon:i});m.on('click',function(){openDetail(r)});m.addTo(layer)}function hotspots(){if(!L.heatLayer)return rows.forEach(makePin);var pts=[];rows.forEach(function(r){var a=Number(r.latitude),o=Number(r.longitude);if(isFinite(a)&&isFinite(o))pts.push([a,o,1])});if(!pts.length)return;L.heatLayer(pts,{radius:38,blur:30,maxZoom:17,minOpacity:.18,gradient:{0.15:'#dce8e5',0.38:'#8bbab0',0.62:'#3f897c',0.82:'#1b5d53',1:'#102f2b'}}).addTo(layer)}function render(){layer.clearLayers();if(viewMode==='hotspots')hotspots();else rows.forEach(makePin);stats()}function stats(){var f=days===30?'30 days':days===90?'90 days':'1 year';if(category==='bike'){var s=rows.filter(function(r){return r.most_severe_injury==='INCAPACITATING INJURY'}).length;setStat(1,'Crashes',rows.length,f);setStat(2,'Serious',s,'incapacitating');setStat(3,'Other',rows.length-s,'other crashes');return}var o=rows.filter(function(r){return isOpen(r.status)}).length,l=category==='planting'?'Planting':category==='removal'?'Removal':category==='graffiti'?'Graffiti':'Rat reports';setStat(1,l,rows.length,f);setStat(2,'Open',o,'currently open');setStat(3,'Closed',rows.length-o,'completed')}
function openDetail(r){var bike=category==='bike';detailKicker.textContent=bike?'Bike crash':(r.sr_type||'311 request');detailTitle.textContent=bike?([r.street_direction,r.street_name].filter(Boolean).join(' ')||'Reported bike crash'):([r.street_number,r.street_direction,r.street_name,r.street_type].filter(Boolean).join(' ')||'311 request');var f=bike?[['Date',dateLabel(r.crash_date)],['Injury',String(r.most_severe_injury||'Not recorded').toLowerCase()],['Type','Pedalcyclist crash'],['Source','Chicago Traffic Crashes']]:[['Status',r.status||'Unknown'],['Created',dateLabel(r.created_date)],['Closed',dateLabel(r.closed_date)||'—'],['Request #',r.sr_number||'—']];detailGrid.innerHTML=f.map(function(x){return'<div class="field"><small>'+esc(x[0])+'</small><strong>'+esc(x[1])+'</strong></div>'}).join('');sheet.classList.add('show');backdrop.classList.add('show')}function closeDetail(){sheet.classList.remove('show');backdrop.classList.remove('show')}
function launch(r){landing.classList.add('hidden');brain.classList.add('active');changeAddress.textContent=r.label;setTimeout(function(){map.invalidateSize();programmaticMove=true;map.setView([r.lat,r.lon],16);setTimeout(function(){programmaticMove=false;query()},250)},30);if(here)map.removeLayer(here);here=L.marker([r.lat,r.lon],{icon:L.divIcon({className:'',html:'<div class="here"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);var u=new URL(location.href);if(r.persistAddress===false)u.searchParams.delete('address');else u.searchParams.set('address',r.label);history.replaceState(null,'',u.toString())}
form.addEventListener('submit',function(e){e.preventDefault();closeSuggestions();var q=input.value.trim();if(!q)return;var p=selectedSuggestion?resolveAddress(selectedSuggestion.text,selectedSuggestion.magicKey):resolveAddress(q+', Chicago, IL','');p.then(launch).catch(function(){setState('Could not confirm that address',true)})});findMe.onclick=function(){if(!navigator.geolocation){setState('Location is not available in this browser',true);return}findMe.disabled=true;findMe.textContent='Finding you…';navigator.geolocation.getCurrentPosition(function(p){findMe.disabled=false;findMe.textContent='⌖ Find me';launch({lat:p.coords.latitude,lon:p.coords.longitude,label:'Your location',persistAddress:false})},function(e){findMe.disabled=false;findMe.textContent='⌖ Find me';setState(e.code===1?'Location permission was not granted':'Could not get your location',true)},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})};changeAddress.onclick=function(){landing.classList.remove('hidden');brain.classList.remove('active');input.value=changeAddress.textContent==='Your location'?'':changeAddress.textContent;setTimeout(function(){input.focus()},50)};map.on('moveend',function(){if(programmaticMove||!brain.classList.contains('active'))return;searchArea.classList.add('show');hideState()});searchArea.onclick=query;document.querySelectorAll('.category').forEach(function(b){b.onclick=function(){category=b.dataset.category;setPressed('.category',b);bottomControls.classList.toggle('bike-mode',category==='bike');query()}});document.querySelectorAll('.status-filter').forEach(function(b){b.onclick=function(){statusFilter=b.dataset.status;setPressed('.status-filter',b);query()}});document.querySelectorAll('.time').forEach(function(b){b.onclick=function(){days=Number(b.dataset.days);setPressed('.time',b);query()}});document.querySelectorAll('.view').forEach(function(b){b.onclick=function(){viewMode=b.dataset.view;setPressed('.view',b);render()}});backdrop.onclick=closeDetail;closeSheet.onclick=closeDetail;var initial=new URLSearchParams(location.search).get('address');if(initial){input.value=initial;resolveAddress(initial+', Chicago, IL','').then(launch).catch(function(){})}
})();
</script>
</body>
</html>
